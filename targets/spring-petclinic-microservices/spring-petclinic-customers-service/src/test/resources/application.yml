spring:
  application:
    name: customers-service
  config:
    import: ""
  cloud:
    config:
      enabled: false
    vault:
      enabled: false
  sql:
    init:
      schema-locations: classpath*:db/hsqldb/schema.sql
      data-locations: classpath*:db/hsqldb/data.sql
  jpa:
    hibernate:
      ddl-auto: none

eureka:
  client:
    enabled: false

logging.level.org.springframework: INFO
