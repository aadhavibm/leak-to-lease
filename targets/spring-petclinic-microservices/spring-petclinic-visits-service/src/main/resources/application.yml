spring:
  application:
    name: visits-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}
  cloud:
    vault:
      uri: ${VAULT_ADDR:http://127.0.0.1:8200}
      authentication: TOKEN
      token: ${SPRING_CLOUD_VAULT_TOKEN:}
      kv:
        enabled: false
      database:
        enabled: false
        backend: database
        role: visits
petclinic:
  vault:
    database:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:${CONFIG_SERVER_URL:http://config-server:8888}
